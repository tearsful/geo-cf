name: Scheduled Geo Data Update

on:
  workflow_dispatch:
    inputs:
      expiration:
        description: 'geo.zip expiration after upload'
        required: true
        default: 'never'
        type: choice
        options:
          - never
          - 300
          - 30m
          - 2h
          - 7d
          - default
  schedule:
    # 计划时刻：北京时间 10:10（Asia/Shanghai；错开整点减轻排队，实际开跑可能更晚）
    - cron: '10 10 * * *'
      timezone: Asia/Shanghai

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-geo-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download geoip and geosite
        run: |
          wget -O /tmp/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget -O /tmp/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

      - name: Download MikroTik CN IP lists
        run: |
          set -euo pipefail
          download_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              if wget -O "$output" "$url"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Retrying download ($attempt/3)..."
                sleep 2
              fi
            done
            return 1
          }
          mkdir -p /tmp/mikrotik
          download_with_retry "https://www.ipdeny.com/ipblocks/data/countries/cn.zone" "/tmp/mikrotik/all_cn.txt" &
          pid_v4=$!
          download_with_retry "https://www.ipdeny.com/ipv6/ipaddresses/blocks/cn.zone" "/tmp/mikrotik/all_cn_ipv6.txt" &
          pid_v6=$!
          wait "$pid_v4" || exit 1
          wait "$pid_v6" || exit 1

          cp /tmp/mikrotik/all_cn.txt /tmp/mikrotik_cn_ipv4.txt
          cp /tmp/mikrotik/all_cn_ipv6.txt /tmp/mikrotik_cn_ipv6.txt

          rsc="/tmp/cn_ip_cidr.rsc"
          {
            printf '%s\n' '/log info "Import cn ipv4 cidr list..."'
            printf '%s\n' '/ip firewall address-list remove [/ip firewall address-list find comment=cn_ip_cidr]'
            printf '%s\n' '/ip firewall address-list'
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line//$'\r'/}"
              [ -z "$line" ] && continue
              printf ':do {add comment=cn_ip_cidr address=%s list=cn_ip_cidr} on-error={}\n' "$line"
            done < "/tmp/mikrotik/all_cn.txt"
            printf '%s\n' ':if ([:len [/ipv6 dhcp-cl  find where status=bound]] > 0) do={'
            printf '%s\n' '/log info "Import cn ipv6 cidr list..."'
            printf '%s\n' '/ipv6 firewall address-list remove [/ipv6 firewall address-list find comment=cn_ipv6]'
            printf '%s\n' '/ipv6 firewall address-list'
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line//$'\r'/}"
              [ -z "$line" ] && continue
              printf ':do {add comment=cn_ipv6 address=%s list=cn_ip_cidr} on-error={}\n' "$line"
            done < "/tmp/mikrotik/all_cn_ipv6.txt"
            printf '%s\n' '}'
          } > "$rsc"
          test -s "$rsc"

      - name: Publish MikroTik CN lists to public geo latest
        env:
          GH_TOKEN: ${{ secrets.TEARSFUL_GEO_RELEASE_TOKEN }}
          TEARSFUL_GEO_REPO_VAR: ${{ vars.TEARSFUL_GEO_REPO }}
          TEARSFUL_GEO_REPO_SECRET: ${{ secrets.TEARSFUL_GEO_REPO }}
        run: |
          set -euo pipefail
          GH_TOKEN="$(printf '%s' "${GH_TOKEN:-}" | tr -d '\r\n')"
          repo="$(printf '%s' "${TEARSFUL_GEO_REPO_VAR:-}" | tr -d '\r\n')"
          if [ -z "$repo" ]; then
            repo="$(printf '%s' "${TEARSFUL_GEO_REPO_SECRET:-}" | tr -d '\r\n')"
          fi
          repo="${repo#https://github.com/}"
          repo="${repo#http://github.com/}"
          repo="${repo%.git}"

          echo "Publish config: GH_TOKEN length=${#GH_TOKEN}, repo_var length=${#TEARSFUL_GEO_REPO_VAR}, repo_secret length=${#TEARSFUL_GEO_REPO_SECRET}"
          echo "Target repository: ${repo:-<empty>}"

          if [ -z "$GH_TOKEN" ]; then
            echo "Missing secret TEARSFUL_GEO_RELEASE_TOKEN." >&2
            exit 1
          fi
          if [ -z "$repo" ] || [ "${repo#*/}" = "$repo" ]; then
            echo "Missing or invalid TEARSFUL_GEO_REPO (need owner/repo, e.g. tearsful/geo)." >&2
            exit 1
          fi
          test -s /tmp/mikrotik_cn_ipv4.txt
          test -s /tmp/mikrotik_cn_ipv6.txt

          owner="${repo%%/*}"
          name="${repo#*/}"
          api() {
            curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          perm_code="$(api -o /tmp/geo_pub_perm.json -w '%{http_code}' \
            "https://api.github.com/repos/${owner}/${name}")"
          echo "GET repo HTTP ${perm_code}, push=$(jq -r '.permissions.push // "n/a"' /tmp/geo_pub_perm.json)"
          if [ "$perm_code" = "404" ]; then
            echo "Token cannot see ${repo}. Add this repo to the PAT repository list (fine-grained) or fix TEARSFUL_GEO_REPO." >&2
            exit 1
          fi
          if [ "$perm_code" = "403" ]; then
            echo "PAT cannot access ${repo}. Fine-grained: add repo + Contents Read and write; org repos may need SSO authorize." >&2
            cat /tmp/geo_pub_perm.json >&2 || true
            exit 1
          fi
          if [ "$(jq -r '.permissions.push // empty' /tmp/geo_pub_perm.json)" = "false" ]; then
            echo "PAT has no push/Contents write on ${repo}. Upgrade token permissions, then update TEARSFUL_GEO_RELEASE_TOKEN in geo-cf." >&2
            exit 1
          fi

          http_code="$(api -o /tmp/geo_pub_release.json -w '%{http_code}' \
            "https://api.github.com/repos/${owner}/${name}/releases/tags/latest")"
          echo "GET release tags/latest HTTP ${http_code}"

          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            echo "GitHub API auth failed. Check TEARSFUL_GEO_RELEASE_TOKEN permissions for ${repo}." >&2
            cat /tmp/geo_pub_release.json >&2 || true
            exit 1
          fi

          if [ "$http_code" = "404" ]; then
            http_code="$(api -o /tmp/geo_pub_release.json -w '%{http_code}' -X POST \
              "https://api.github.com/repos/${owner}/${name}/releases" \
              -d '{"tag_name":"latest","name":"latest","body":"MikroTik CN IPv4/IPv6 CIDR lists (auto-updated).","make_latest":"true"}')"
            echo "POST create release HTTP ${http_code}"
            if [ "$http_code" != "201" ]; then
              cat /tmp/geo_pub_release.json >&2 || true
              exit 1
            fi
          elif [ "$http_code" != "200" ]; then
            cat /tmp/geo_pub_release.json >&2 || true
            exit 1
          fi

          release_id="$(jq -r '.id' /tmp/geo_pub_release.json)"
          upload_base="$(jq -r '.upload_url' /tmp/geo_pub_release.json | sed 's/{?name,label}//')"

          for asset in mikrotik_cn_ipv4.txt mikrotik_cn_ipv6.txt; do
            asset_id="$(jq -r --arg n "$asset" '.assets[]? | select(.name==$n) | .id' /tmp/geo_pub_release.json)"
            if [ -n "$asset_id" ] && [ "$asset_id" != "null" ]; then
              api -o /tmp/geo_pub_delete.json -w '%{http_code}' -X DELETE \
                "https://api.github.com/repos/${owner}/${name}/releases/assets/${asset_id}" >/dev/null
            fi
            http_code="$(api -o /tmp/geo_pub_upload.json -w '%{http_code}' -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@/tmp/${asset}" \
              "${upload_base}?name=${asset}")"
            echo "Upload ${asset} HTTP ${http_code}"
            if [ "$http_code" != "201" ]; then
              cat /tmp/geo_pub_upload.json >&2 || true
              exit 1
            fi
          done

          api -o /tmp/geo_pub_latest.json -X PATCH \
            "https://api.github.com/repos/${owner}/${name}/releases/${release_id}" \
            -d '{"make_latest":"true"}' >/dev/null

          api -o /tmp/geo_pub_release_list.json \
            "https://api.github.com/repos/${owner}/${name}/releases?per_page=100" >/dev/null
          jq -r '.[].tag_name' /tmp/geo_pub_release_list.json | while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            [ "$tag" = "latest" ] && continue
            rid="$(jq -r --arg t "$tag" '.[] | select(.tag_name==$t) | .id' /tmp/geo_pub_release_list.json)"
            [ -n "$rid" ] && [ "$rid" != "null" ] || continue
            api -X DELETE "https://api.github.com/repos/${owner}/${name}/releases/${rid}" >/dev/null || true
          done

          echo "Published mikrotik_cn_ipv4.txt and mikrotik_cn_ipv6.txt to ${repo} release latest"

      - name: Download additional rule lists
        run: |
          set -euo pipefail
          wget -O /tmp/neodevhost_domain.txt https://raw.githubusercontent.com/neodevpro/neodevhost/master/domain
          wget -O /tmp/mosdns_adrules.txt https://raw.githubusercontent.com/Cats-Team/AdRules/main/mosdns_adrules.txt
          wget -O /tmp/AWAvenue-Ads-Rule-Mosdns_v5.txt https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Mosdns_v5.txt
          
      - name: Download Cloudflare IP lists
        run: |
          set -euo pipefail
          download_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in 1 2 3; do
              if wget -O "$output" "$url"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Retrying download ($attempt/3)..."
                sleep 2
              fi
            done
            return 1
          }
          download_with_retry "https://api.cloudflare.com/client/v4/ips" "/tmp/cloudflare_ips.json"
          jq -r '
            if .success != true then
              error("Cloudflare API returned an error response")
            else
              (.result.ipv4_cidrs[]?, .result.ipv6_cidrs[]?)
            end
          ' /tmp/cloudflare_ips.json > /tmp/cloudflare-cidr.txt
          test -s /tmp/cloudflare-cidr.txt


      - name: Package geo release archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/geo-release
          cp /tmp/geoip.dat /tmp/geo-release/
          cp /tmp/geosite.dat /tmp/geo-release/
          cp /tmp/neodevhost_domain.txt /tmp/geo-release/domain.txt
          cp /tmp/mosdns_adrules.txt /tmp/geo-release/
          cp /tmp/AWAvenue-Ads-Rule-Mosdns_v5.txt /tmp/geo-release/
          cp /tmp/mikrotik/all_cn.txt /tmp/geo-release/
          cp /tmp/mikrotik/all_cn_ipv6.txt /tmp/geo-release/
          cp /tmp/cloudflare-cidr.txt /tmp/geo-release/
          cd /tmp/geo-release
          zip -r /tmp/geo.zip .

      - name: Upload geo.zip to Cloudflare server
        env:
          CLOUDFLARE_SITE_USER: ${{ secrets.CLOUDFLARE_SITE_USER }}
          CLOUDFLARE_SITE_PASS: ${{ secrets.CLOUDFLARE_SITE_PASS }}
          CLOUDFLARE_MANAGE_URL: ${{ secrets.CLOUDFLARE_MANAGE_URL }}
          CLOUDFLARE_MANAGE_PASS: ${{ secrets.CLOUDFLARE_MANAGE_PASS }}
          CI_UPLOAD_TOKEN: ${{ secrets.CI_UPLOAD_TOKEN }}
          GEO_ZIP_EXPIRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.expiration || 'never' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_SITE_USER"
          test -n "$CLOUDFLARE_SITE_PASS"
          test -n "$CLOUDFLARE_MANAGE_URL"
          test -n "$CLOUDFLARE_MANAGE_PASS"
          test -n "$CI_UPLOAD_TOKEN"
          SITE_USER="$(printf '%s' "$CLOUDFLARE_SITE_USER" | tr -d '\r\n')"
          SITE_PASS="$(printf '%s' "$CLOUDFLARE_SITE_PASS" | tr -d '\r\n')"
          MANAGE_URL="$(printf '%s' "$CLOUDFLARE_MANAGE_URL" | tr -d '\r\n')"
          MANAGE_PASS="$(printf '%s' "$CLOUDFLARE_MANAGE_PASS" | tr -d '\r\n')"
          UPLOAD_TOKEN="$(printf '%s' "$CI_UPLOAD_TOKEN" | tr -d '\r\n')"
          EXPIRATION="$(printf '%s' "$GEO_ZIP_EXPIRATION" | tr -d '\r\n')"
          curl_form_args=(-F "c=@/tmp/geo.zip")
          if [ "$EXPIRATION" != "default" ]; then
            curl_form_args+=(-F "e=${EXPIRATION}")
          fi
          HTTP_STATUS="$(command curl --show-error -# \
            --output /tmp/cloudflare-upload-response.txt \
            --write-out "%{http_code}" \
            --url "${MANAGE_URL}:${MANAGE_PASS}" \
            -H "X-CI-Upload-Token: ${UPLOAD_TOKEN}" \
            -u "${SITE_USER}:${SITE_PASS}" \
            -X PUT \
            "${curl_form_args[@]}")"
          printf '\nHTTP_STATUS=%s\n' "$HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            sed -n '1,80p' /tmp/cloudflare-upload-response.txt
            exit 1
          fi

      - name: Get current date
        id: date
        run: echo "date=$(date +'%y%m%d%H%M%S')" >> $GITHUB_OUTPUT
  
      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name }}-${{ steps.date.outputs.date }}
          name: ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          files: |
            /tmp/geo.zip
            /tmp/cn_ip_cidr.rsc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
